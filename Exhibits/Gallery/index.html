.mark{width:34px;height:34px;border-radius:12px;background:#ffb238;color:#111;display:flex;align-items:center;justify-content:center;font-weight:500}

figure{margin:0;background:#121212;border:1px solid #1f1f1f;border-radius:14px;overflow:hidden;cursor:zoom-in;min-width:0}
figure:hover{border-color:#3a3a3a}figure img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#151518}

figcaption small{display:block;color:#6e6e6e;font-size:10px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#Box{position:fixed;inset:0;z-index:5;background:#000000e6;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:24px;cursor:zoom-out}
#Box.open{display:flex}#Box img{max-width:96vw;max-height:86vh;border-radius:10px;border:1px solid #2a2a2a}#Box small{color:#9a9a9a}

  const h=document.createElement('h2');h.innerHTML=`${dom}<span>${its.length}</span>`;const g=document.createElement('div');g.className='grid';
  for(const i of its){const f=document.createElement('figure');f.innerHTML=`<img loading="lazy" src="${i.src}" alt=""><figcaption><b title="${i.name}">${i.name}</b><small>${i.test} · ${i.w}×${i.h}</small></figcaption>`;
   f.onclick=()=>{Box.querySelector('img').src=i.src;Box.querySelector('small').textContent=`${dom} / ${i.name} · ${i.test} · full PNG: Exhibits/Images/${i.src.replace(/\.jpg$/,'.png')}`;Box.classList.add('open')};g.append(f)}
  M.append(h,g)}}
Box.onclick=()=>Box.classList.remove('open');addEventListener('keydown',e=>{if(e.key==='Escape')Box.classList.remove('open')});
Q.oninput=render;D.onchange=render;render();
</script></body></html>
