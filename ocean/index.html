<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontier Ocean — Adaptive Column Simulation</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #04070c; }
    body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #cfe2f3; }
    #gfx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
    #panel {
      position: absolute; top: 12px; right: 12px; width: 252px;
      background: rgba(6, 12, 20, 0.82); border: 1px solid rgba(110, 170, 220, 0.25);
      border-radius: 8px; padding: 10px 12px; font-size: 11px; line-height: 1.55;
      backdrop-filter: blur(6px); user-select: none;
    }
    #panel h1 { font-size: 12px; letter-spacing: 0.08em; color: #9fd0ff; margin-bottom: 6px; font-weight: 600; }
    #panel h2 { font-size: 10px; letter-spacing: 0.1em; color: #6f9cc0; margin: 8px 0 3px; font-weight: 600; text-transform: uppercase; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 3px 0; }
    .row label { color: #a8c4da; }
    select, input[type=range] { accent-color: #4da3ff; }
    select { background: #0b1622; color: #cfe2f3; border: 1px solid #274358; border-radius: 4px; padding: 2px 4px; font: inherit; }
    input[type=checkbox] { accent-color: #4da3ff; }
    #stats { color: #8fb8d8; white-space: pre; }
    #stats b { color: #cfe9ff; font-weight: 600; }
    #hint {
      position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: #7fa8c8;
      background: rgba(6, 12, 20, 0.7); padding: 6px 10px; border-radius: 6px; line-height: 1.6;
    }
    #err {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: #04070c; color: #ffb0a0; font-size: 14px; text-align: center; padding: 40px; line-height: 1.8;
    }
    .badge { display: inline-block; padding: 0 6px; border: 1px solid #2c4d68; border-radius: 4px; color: #9fd0ff; }
  </style>
</head>
<body>
  <canvas id="gfx"></canvas>
  <div id="panel">
    <h1>FRONTIER OCEAN</h1>
    <div>adaptive column simulation · no FFT</div>
    <h2>Quality tier</h2>
    <div class="row"><label for="tier">GPU preset</label>
      <select id="tier">
        <option value="low">GTX 1050</option>
        <option value="mid">GTX 1660</option>
        <option value="high" selected>RTX 3060</option>
        <option value="ultra">RTX 4090</option>
      </select></div>
    <h2>Simulation</h2>
    <div class="row"><label for="amr">Adaptive AMR grid</label><input id="amr" type="checkbox" checked /></div>
    <div class="row"><label for="wind">Sea state (wind)</label><input id="wind" type="range" min="0" max="100" value="55" style="width:120px" /></div>
    <div class="row"><label for="spray">Spray particles</label><input id="spray" type="checkbox" checked /></div>
    <h2>Debug</h2>
    <div class="row"><label for="minimap">AMR map overlay</label><input id="minimap" type="checkbox" checked /></div>
    <div class="row"><label for="wire">Wave height view</label><input id="waveview" type="checkbox" /></div>
    <h2>Stats</h2>
    <div id="stats">booting…</div>
  </div>
  <div id="hint">
    <b>drag</b> orbit · <b>wheel</b> zoom · <b>click water</b> splash (watch the AMR grid react)<br />
    WebGPU required — Chrome / Edge 113+
  </div>
  <div id="err"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
