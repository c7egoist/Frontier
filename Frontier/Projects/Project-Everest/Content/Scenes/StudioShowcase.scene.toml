# Project Everest — Studio Showcase inspection scene
format = "frontier.scene"
version = 1
name = "StudioShowcase"

[environment]
sun_azimuth_degrees = 215.0
sun_elevation_degrees = 38.0
atmosphere_turbidity = 1.9
cloud_coverage = 0.10
fog_density = 0.0006

[illumination]
rtx_path = "HardwareRayQuery"
