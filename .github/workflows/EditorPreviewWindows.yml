name: Windows build (Frontier + Everest)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  WindowsBuild:
    name: Build Frontier.exe and Everest.exe (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare UI dependencies and fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check -r Automation/FontRequirements.txt
          python Automation/PrepareUI.py
          python Automation/PrepareFonts.py
      - name: Configure Windows x64
        run: cmake -S . -B Build/Windows -A x64 -DBUILD_TESTING=OFF
      - name: Build Frontier and Everest in one Windows build
        run: cmake --build Build/Windows --config Release --target Frontier Everest --parallel
      # Optional Linux equivalent, intentionally not run by this workflow:
      # cmake -S . -B Build/Linux -G Ninja -DBUILD_TESTING=OFF
      # cmake --build Build/Linux --target Frontier Everest --parallel
