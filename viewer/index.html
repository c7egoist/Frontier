<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — roof generator</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1d2027; --line:#2c313b; --ink:#e7e9ee; --dim:#98a0af; --accent:#e0a252; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 288px 1fr; height: 100%; }
  #panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 40px; }
  #panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .01em; }
  #panel .sub { color: var(--dim); font-size: 11.5px; margin-bottom: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 9px 10px 11px; }
  legend { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 4px; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
  label span { color: var(--dim); }
  select, input[type=number], input[type=text] { background: #12141a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font: inherit; width: 120px; }
  input[type=range] { width: 122px; accent-color: var(--accent); }
  input[type=color] { background: none; border: 1px solid var(--line); border-radius: 6px; width: 40px; height: 24px; padding: 0; }
  input[type=checkbox] { accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
  .row label { display: flex; font-size: 12px; }
  #stage { position: relative; }
  canvas { display: block; }
  #hud { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 11.5px;
    background: rgba(12,14,18,.72); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; pointer-events: none; }
  #hud b { color: var(--ink); font-weight: 600; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }
  button.ghost { background: #12141a; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font: inherit; cursor: pointer; }
  button.ghost:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Frontier roof generator</h1>
    <div class="sub">procedural JP / CN / KR roofs — no fixed assets</div>

    <fieldset>
      <legend>roof</legend>
      <label><span>preset</span><select id="preset"></select></label>
      <label><span>type</span><select id="form"></select></label>
      <label><span>tile</span><select id="tile"></select></label>
      <label><span>colour</span><input type="color" id="tileColour"></label>
      <label><span>wood</span><input type="color" id="woodColour"></label>
    </fieldset>

    <fieldset>
      <legend>shape</legend>
      <label><span>eave overhang</span><input type="range" id="overhang" min="0.4" max="3" step="0.05"></label>
      <label><span>gable overhang</span><input type="range" id="gable" min="0" max="3" step="0.05"></label>
      <label><span>pitch</span><input type="range" id="pitch" min="0.2" max="0.9" step="0.01"></label>
      <label><span>corner lift 起翘</span><input type="range" id="sweep" min="0" max="1.6" step="0.05"></label>
      <label><span>corner push 冲出</span><input type="range" id="push" min="0" max="1.4" step="0.05"></label>
    </fieldset>

    <fieldset>
      <legend>layers</legend>
      <div class="row" id="layers"></div>
      <div class="hint">uncheck 瓦 to inspect the 垂木 / 瓦桟 / 野地板 build-up underneath</div>
    </fieldset>

    <fieldset>
      <legend>view</legend>
      <label><span>explode layers</span><input type="range" id="explode" min="0" max="1.2" step="0.02"></label>
      <label><span>wireframe</span><input type="checkbox" id="wire"></label>
      <div style="display:flex; gap:8px; margin-top:8px">
        <button class="ghost" id="btnIso">iso</button>
        <button class="ghost" id="btnGable">gable</button>
        <button class="ghost" id="btnCorner">eave corner</button>
        <button class="ghost" id="btnTop">plan</button>
      </div>
    </fieldset>
  </aside>
  <div id="stage">
    <div id="hud"></div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
