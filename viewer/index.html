<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — Single-Mesh Tree Wind Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9edf0; font-family: system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #view { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  #panel { width: 280px; background: #14181c; color: #dfe6ea; padding: 18px; box-sizing: border-box; overflow-y: auto; }
  #panel h1 { font-size: 17px; margin: 0 0 4px; }
  #panel p.sub { font-size: 12px; color: #8fa0ab; margin: 0 0 16px; }
  .row { margin: 12px 0; font-size: 13px; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  .check { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
  #stats { font-size: 12px; color: #9fb3c0; background: #0e1215; padding: 10px; border-radius: 6px; margin-top: 14px; white-space: pre-wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #1d7a3a; color: #fff; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="gl"></canvas></div>
  <div id="panel">
    <h1>Frontier Tree</h1>
    <p class="sub">single fused mesh &middot; pivot wind &middot; no crack</p>
    <div class="badge" id="validBadge">watertight: checking…</div>
    <div class="row">
      <label><span>Wind strength</span><span id="windVal">0.6</span></label>
      <input id="wind" type="range" min="0" max="1.5" step="0.01" value="0.6">
    </div>
    <div class="row">
      <label><span>Wind speed</span><span id="speedVal">1.0</span></label>
      <input id="speed" type="range" min="0" max="3" step="0.01" value="1.0">
    </div>
    <div class="check"><input id="spin" type="checkbox" checked><label for="spin">auto-rotate</label></div>
    <div class="check"><input id="wire" type="checkbox"><label for="wire">wireframe overlay</label></div>
    <div class="check"><input id="showLeaves" type="checkbox" checked><label for="showLeaves">leaves</label></div>
    <div class="check"><input id="showBark" type="checkbox" checked><label for="showBark">bark</label></div>
    <div id="stats">loading…</div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
