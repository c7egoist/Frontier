<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Inspector · Frontier</title>
<link rel="stylesheet" href="./MaterialInspector.css">
<link rel="stylesheet" href="./Outliner.css">
</head>
<body class="pz-scope">
<!-- The TextureStudio Material workspace inspector, redesigned in the Project Zero style, with its outliner card docked
     beside it.  Both cards share one document through the inspector Hub.  ?outliner=0 shows the inspector card alone. -->
<main class="mi-dock">
  <div id="Nav"></div>
  <div class="mi-pair">
    <aside id="Outliner" class="ol-host"></aside>
    <div id="Card" class="mi-host"></div>
  </div>
</main>
<script type="module">
  import { Mount } from "./MaterialInspector.js";
  import { DockNav } from "./CardKit.js";
  document.getElementById("Nav").outerHTML = DockNav("material");
  import { MountMaterialOutliner } from "./MaterialOutliner.js";
  const Docked = new URLSearchParams(location.search).get("outliner") !== "0";
  globalThis.MaterialInspector = Mount(document.getElementById("Card"), { docked: Docked });
  if (Docked) globalThis.MaterialOutliner = MountMaterialOutliner(document.getElementById("Outliner"), globalThis.MaterialInspector);
  else document.getElementById("Outliner").remove();
</script>
</body>
</html>
