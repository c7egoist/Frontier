<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brush Studio · Frontier</title>
<link rel="stylesheet" href="../MaterialInspector/MaterialInspector.css">
<link rel="stylesheet" href="../MaterialInspector/Outliner.css">
<link rel="stylesheet" href="./BrushStudio.css">
</head>
<body>
<!-- TextureStudio's paint brushes, redesigned as a Procreate-style Brush Studio in the Project Zero language: the Brush
     Library card docks beside the Studio card (section rail · settings · drawing pad with per-tool popups).
     ?brush=<catalogue id> picks the starting brush, ?tool=<tool id> the starting tool, ?popup=1 opens its menu. -->
<main class="bs-dock">
  <div id="Nav"></div>
  <div id="Studio" class="bs-host"></div>
</main>
<script type="module">
  import { Mount } from "./BrushStudio.js";
  import { DockNav } from "../MaterialInspector/CardKit.js";
  document.getElementById("Nav").outerHTML = DockNav("brush");
  const Q = new URLSearchParams(location.search);
  const Hub = Mount(document.getElementById("Studio"), { brush: Q.get("brush") || undefined, tool: Q.get("tool") || undefined });
  if (Q.get("section")) Hub.Section(Q.get("section"));
  if (Q.get("popup") === "1") Hub.OpenPopup(Hub.State.Tool);
  globalThis.BrushStudio = Hub;
</script>
</body>
</html>
