<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern / Stamp Studio · Frontier</title>
<link rel="stylesheet" href="../MaterialInspector/MaterialInspector.css">
<link rel="stylesheet" href="./ArtworkInspector.css">
<link rel="stylesheet" href="../MaterialInspector/Outliner.css">
<link rel="stylesheet" href="../MaterialInspector/Workspace.css">
</head>
<body>
<!-- TextureStudio's Pattern Studio / Stamp Studio inspector, redesigned in the Project Zero style, with its layer outliner
     docked beside it (one shared document through the inspector Hub).  ?mode=pattern (default) or ?mode=stamp;
     ?outliner=0 shows the inspector card alone. -->
<main class="mi-dock">
  <div id="Nav"></div>
  <div class="mi-trio">
    <aside id="Outliner" class="ol-host"></aside>
    <div id="Viewport" class="vp-host"></div>
    <div id="Card" class="mi-host"></div>
  </div>
</main>
<script type="module">
  import { Mount } from "./ArtworkInspector.js";
  import { DockNav } from "../MaterialInspector/CardKit.js";
  const Mode = new URLSearchParams(location.search).get("mode") === "stamp" ? "stamp" : "pattern";
  document.getElementById("Nav").outerHTML = DockNav(Mode);
  document.title = `${Mode === "stamp" ? "Stamp" : "Pattern"} Studio · Frontier`;
  import { MountArtworkOutliner } from "./ArtworkOutliner.js";
  const Docked = new URLSearchParams(location.search).get("outliner") !== "0";
  globalThis.ArtworkInspector = Mount(document.getElementById("Card"), { mode: Mode, docked: Docked });
  if (Docked) globalThis.ArtworkOutliner = MountArtworkOutliner(document.getElementById("Outliner"), globalThis.ArtworkInspector);
  else { document.getElementById("Outliner").remove(); document.querySelector(".mi-trio").classList.add("solo"); }
  import { MountViewport } from "../MaterialInspector/Viewport.js";
  const Hub = globalThis.ArtworkInspector;
  const Meta = () => `${Hub.State.Doc?.name || (Mode === "stamp" ? "Stamp" : "Pattern")} · ${Mode === "stamp" ? "decal" : "seamless tile"}`;
  globalThis.Viewport = MountViewport(document.getElementById("Viewport"), Mode === "stamp"
    ? { Title: "Viewport", Meta: Meta(), Views: [["Decal", "decal"], ["On mesh", "mesh"], ["UV", "uv"]], Chips: ["Stamp Studio"] }
    : { Title: "Viewport", Meta: Meta(), Views: [["Tile", "tile"], ["Repeat 3×3", "repeat"], ["On mesh", "mesh"]], Chips: ["Pattern Studio"] });
  Hub.Subscribe(() => globalThis.Viewport.SetMeta(Meta()));
</script>
</body>
</html>
