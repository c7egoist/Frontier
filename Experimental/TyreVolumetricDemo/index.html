<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volumetric tyre — WebGPU demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #15181d; color: #e8ebef; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0 0 0 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #panel { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto;
      background: rgba(20, 23, 28, 0.88); border: 1px solid #2c323c; border-radius: 10px; padding: 14px; box-sizing: border-box; }
    #panel h1 { font-size: 15px; margin: 0 0 4px; }
    #panel p { margin: 0 0 10px; color: #9aa3ae; }
    .row { display: block; margin: 9px 0; }
    .row span { display: inline-block; }
    .row .val { float: right; color: #7fd1ff; font-variant-numeric: tabular-nums; }
    .row input { width: 100%; margin-top: 3px; }
    .check { display: block; margin: 6px 0; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 7px; background: #2a313c; color: #e8ebef; border: 1px solid #3a4350; border-radius: 6px; cursor: pointer; }
    button:hover { background: #343d4a; }
    #hud { position: fixed; left: 12px; bottom: 12px; white-space: pre; background: rgba(20, 23, 28, 0.82); padding: 8px 10px;
      border-radius: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #cfd6df; }
    #message { display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 460px;
      background: #2b1d1d; border: 1px solid #6b3030; padding: 16px; border-radius: 10px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <h1>Volumetric tyre (tetrahedral FEM)</h1>
    <p>Drag to orbit · wheel to zoom. Explicit FEM with volume-preserving inflation; no XPBD.</p>
    <div id="controls"></div>
    <label class="check"><input type="checkbox" id="edges" /> Show tetrahedral edges</label>
    <label class="check"><input type="checkbox" id="follow" checked /> Follow the wheel</label>
    <label class="row"><span>Colour</span>
      <select id="colour" style="width:100%;margin-top:3px">
        <option value="0">Rubber</option>
        <option value="1">Deformation (blue bulge · red squash)</option>
      </select>
    </label>
    <label class="row"><span>Road</span>
      <select id="road" style="width:100%;margin-top:3px">
        <option value="speedbump">Speed bump</option>
        <option value="kerb">Kerb strike</option>
        <option value="mixed">Mixed: bump, kerb, bump</option>
        <option value="flat">Flat</option>
      </select>
    </label>
    <div class="buttons"><button id="pause">Pause</button><button id="reset">Reset</button></div>
  </div>
  <pre id="hud"></pre>
  <div id="message"></div>
  <script type="module" src="./src/main.js?v=5"></script>
</body>
</html>
