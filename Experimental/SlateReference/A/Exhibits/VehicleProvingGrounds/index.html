<!DOCTYPE html>
<!--
==============================================================================================================================================
                                                                  INDEX.HTML
==============================================================================================================================================
 🧩 Distance-field GI exhibit & dedicated Road Studio workspace in the Frontier Editor.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier · Proving Grounds &amp; Road Studio</title>
<link rel="stylesheet" href="Style/FrontierEditor.css">
<link rel="stylesheet" href="Style/InspectorReference.css">
</head>
<body>
    <header id="workspace-bar" aria-label="Frontier Workspaces">
        <div class="workspace-brand">
            <span class="workspace-brand-mark">frontier<span class="workspace-brand-dot">.</span></span>
        </div>
        <nav class="workspace-tabs" role="tablist">
            <button type="button" class="workspace-tab active" data-workspace-tab="proving" role="tab" aria-selected="true">
                <span class="workspace-tab-dot"></span>
                <span class="workspace-tab-title">Proving Grounds</span>
                <span class="workspace-tab-sub">3D Driving · GI · Physics</span>
            </button>
            <button type="button" class="workspace-tab" data-workspace-tab="roadstudio" role="tab" aria-selected="false">
                <span class="workspace-tab-dot studio"></span>
                <span class="workspace-tab-title">Road Studio</span>
                <span class="workspace-tab-sub">2D / 3D Roads · Bridges · Interchanges</span>
            </button>
        </nav>
        <div class="workspace-bar-fill"></div>
        <div class="workspace-meta" id="workspace-network-meta">Northbank district · 10 roads · 1 bridge</div>
        <div class="workspace-actions">
            <button type="button" class="workspace-action-btn" data-workspace-action="open-studio" title="Switch to the dedicated Road Studio workspace (E)">
                Road Studio Workspace
            </button>
            <button type="button" class="workspace-action-btn primary" data-workspace-action="drive-network" title="Teleport vehicle onto the Road Studio network in Proving Grounds">
                Drive on Network
            </button>
        </div>
    </header>

    <div id="shell">
        <aside id="outliner" class="column editor-column">
            <div class="column-tabs">
                <div class="column-tab">Outliner <button data-overlay="Panel" title="Hide the editor columns (P)">×</button></div>
                <div class="tab-fill"></div>
            </div>
            <div class="outliner-body" id="outliner-body"></div>
        </aside>
        <section id="viewport-column" class="column">
            <div class="column-tabs viewport-tabs">
                <div class="column-tab">Viewport</div>
                <div class="scene-pill">Proving Grounds</div>
                <div class="tab-fill"></div>
            </div>
            <div class="viewport-bar" id="viewport-bar"></div>
            <div id="stage">
                <canvas id="viewport"></canvas>
                <canvas id="capture" class="capture"></canvas>
                <div id="hud"><button class="overlay-close" data-overlay="Hud" title="Hide the readout (H)">×</button><pre id="hud-text">Starting…</pre></div>
                <div id="inset-frame" class="hidden">
                    <button class="overlay-close" data-overlay="Inset" title="Hide the distance slice (J)">×</button>
                    <div id="inset-legend">GDF slice · blue inside · amber outside · magenta = rewritten by a moving occupant · teal = scrolled · green = cascade 0</div>
                </div>
                <div id="overlay-dock" class="hidden"></div>
                <div id="overlay-notice" class="hidden"></div>
                <div id="event-notice" class="hidden"></div>
                <div id="bring-up">
                    <h2>Frontier · Proving Grounds</h2>
                    <div class="bring-up-caption">Starting</div>
                    <div class="bring-up-bar"><div></div></div>
                </div>
                <div id="failure" class="hidden"></div>
            </div>
        </section>
        <aside id="inspector" class="column editor-column">
            <div class="column-tabs">
                <div class="column-tab">Inspector <button data-overlay="Panel" title="Hide the editor columns (P)">×</button></div>
                <div class="tab-fill"></div>
            </div>
            <div class="inspector-top" id="inspector-top"></div>
            <div class="inspector-content" id="inspector-content"></div>
        </aside>
        <footer id="status"></footer>
    </div>

    <section id="road-studio-workspace" class="hidden" aria-label="Road Studio Workspace">
        <iframe id="road-studio-frame" title="Frontier Road Studio — Roads, Bridges &amp; Interchanges" src="RoadStudio.html?embedded=1"></iframe>
    </section>

    <script type="module" src="Source/IlluminationHost.js?v=road-studio-workspace-1"></script>
</body>
</html>
