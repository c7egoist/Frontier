<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Baking · Frontier</title>
<link rel="stylesheet" href="../MaterialInspector/MaterialInspector.css">
<link rel="stylesheet" href="../ArtworkInspector/ArtworkInspector.css">
<link rel="stylesheet" href="./BakeInspector.css">
<link rel="stylesheet" href="../MaterialInspector/Outliner.css">
</head>
<body>
<!-- TextureStudio's Baking workspace inspector, redesigned in the Project Zero style, with its bake-queue outliner docked
     beside it (one shared state through the inspector Hub; ?outliner=0 shows the card alone).  No bake engine is attached
     on this page, so "Bake" runs the card's labelled dry run (see README for wiring the real bakers). -->
<main class="mi-dock">
  <div id="Nav"></div>
  <div class="mi-pair">
    <aside id="Outliner" class="ol-host"></aside>
    <div id="Card" class="mi-host"></div>
  </div>
</main>
<script type="module">
  import { Mount } from "./BakeInspector.js";
  import { DockNav } from "../MaterialInspector/CardKit.js";
  document.getElementById("Nav").outerHTML = DockNav("bake");
  import { MountBakeOutliner } from "./BakeOutliner.js";
  const Docked = new URLSearchParams(location.search).get("outliner") !== "0";
  globalThis.BakeInspector = Mount(document.getElementById("Card"), { docked: Docked });
  if (Docked) globalThis.BakeOutliner = MountBakeOutliner(document.getElementById("Outliner"), globalThis.BakeInspector);
  else document.getElementById("Outliner").remove();
</script>
</body>
</html>
