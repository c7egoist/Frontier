<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — East Asian Roof Generator</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f25; --line:#2a2e36; --ink:#d7dbe2; --dim:#8b93a0; --acc:#e0a458; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  #panel { position:fixed; top:12px; right:12px; bottom:12px; width:315px;
    background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px);
    border:1px solid var(--line); border-radius:10px; overflow-y:auto; padding:10px 12px 16px;
    scrollbar-width: thin; }
  .p-head h2 { margin:2px 0 8px; font-size:15px; letter-spacing:.4px; }
  .p-head h2 span { color:var(--dim); font-size:11px; font-weight:400; }
  .presets { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .presets button { background:#232830; color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:4px 8px; cursor:pointer; font-size:11.5px; }
  .presets button:hover { border-color:var(--acc); color:var(--acc); }
  .group { border-top:1px solid var(--line); padding:8px 0 4px; }
  .group h3 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--acc); }
  .row { display:grid; grid-template-columns: 118px 1fr 52px; gap:6px; align-items:center; margin:3px 0; }
  .row.bool { grid-template-columns: 1fr auto; }
  .row label { color:var(--dim); font-size:12px; }
  .row .val { font-size:11px; color:var(--ink); text-align:right; font-variant-numeric: tabular-nums; }
  input[type=range] { width:100%; accent-color: var(--acc); height:22px; }
  input[type=color] { width:52px; height:22px; border:1px solid var(--line); border-radius:4px; background:none; padding:0; }
  select { grid-column: 1 / -1; background:#232830; color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:5px; }
  .actions { display:flex; gap:6px; margin-top:10px; }
  .actions button { flex:1; background:#232830; border:1px solid var(--line); color:var(--ink);
    padding:7px; border-radius:7px; cursor:pointer; }
  .actions button:hover { border-color:var(--acc); color:var(--acc); }
  #stats { position:fixed; left:12px; bottom:12px; background:color-mix(in srgb, var(--panel) 88%, transparent);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:11.5px; color:var(--dim); }
  #stats b { color:var(--acc); }
  body.shot #panel, body.shot #stats { display:none; }
</style>
<script type="importmap">
  { "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="panel"></div>
<div id="stats">building…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
