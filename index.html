<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111315" />
  <title>SOLID ARC — WebGPU parametric sketcher</title>
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <main class="app-shell">
    <div class="workspace">
      <aside class="floating-toolbar" aria-label="Drawing tools">
        <button class="tool-button is-active" data-tool="select" title="Select (V)" aria-label="Select">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 3 12 9-6 1-3 7Z"/></svg>
        </button>
        <button class="tool-button" data-tool="line" title="Line (L)" aria-label="Line">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 19 14-14"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="5" r="1.8"/></svg>
        </button>
        <button class="tool-button" data-tool="polyline" title="Polyline (P)" aria-label="Polyline">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 18 5-10 5 6 6-9"/><circle cx="4" cy="18" r="1.7"/><circle cx="9" cy="8" r="1.7"/><circle cx="14" cy="14" r="1.7"/><circle cx="20" cy="5" r="1.7"/></svg>
        </button>
        <button class="tool-button" data-tool="rectangle" title="Rectangle (R)" aria-label="Rectangle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button class="tool-button" data-tool="circle" title="Circle (C)" aria-label="Circle">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.3"/></svg>
        </button>
        <button class="tool-button" data-tool="ellipse" title="Ellipse (E)" aria-label="Ellipse">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="5"/><path d="M4 12h16"/></svg>
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="tool-button curve-tool" data-tool="bezier" title="Cubic Bézier (B)" aria-label="Bézier curve">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18c5-12 11-12 16-1"/><path d="M4 18 9 5M20 17 15 7"/><circle cx="4" cy="18" r="1.7"/><circle cx="9" cy="5" r="1.7"/><circle cx="15" cy="7" r="1.7"/><circle cx="20" cy="17" r="1.7"/></svg>
        </button>
        <button class="tool-button curve-tool" data-tool="hermite" title="Continuous cubic Hermite (H)" aria-label="Hermite curve">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17c6-11 10 9 16-7"/><path d="M4 17 8 9M20 10l-4 3"/><circle cx="4" cy="17" r="1.7"/><circle cx="20" cy="10" r="1.7"/></svg>
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="tool-button plane-tool" data-tool="plane" title="Construction plane (A)" aria-label="Construction plane">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 8-9 8 9-8 3Z"/><path d="M12 7v12"/><path d="m4 16 8-5 8 5"/></svg>
        </button>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="tool-button mode-button is-active" data-view="3d" title="3D view (2)" aria-label="3D view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>
        </button>
        <button class="tool-button mode-button" data-view="2d" title="2D drafting view (1)" aria-label="2D view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1"/><path d="M8 15 11 11l2 2 3-4"/></svg>
        </button>
      </aside>

      <section class="viewport-column" aria-label="Solid Arc viewport">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="app-brand">
            <div class="brand-mark">✦</div>
            <div><div class="brand-name">SOLID ARC</div><div class="brand-kicker">WebGPU parametric sketcher</div></div>
            <span class="renderer-readout" id="rendererReadout">WEBGPU STARTING</span>
          </div>
          <canvas id="draftCanvas" class="is-hidden"></canvas>
          <canvas id="sceneCanvas"></canvas>
          <div class="canvas-crosshair" id="canvasCrosshair"></div>
          <div class="coordinate-readout" id="coordinateReadout">X 0.00 <span>·</span> Y 0.00</div>
          <div class="canvas-hint is-hidden" id="canvasHint">Choose a tool to begin drawing</div>
          <div class="zoom-control">
            <button id="zoomOut" aria-label="Zoom out">−</button>
            <span id="zoomReadout">100%</span>
            <button id="zoomIn" aria-label="Zoom in">＋</button>
          </div>
          <div class="orbit-hint is-visible" id="orbitHint"><span class="mouse-icon">⌁</span> DRAG EMPTY SPACE TO ORBIT&nbsp;&nbsp;·&nbsp;&nbsp;SCROLL TO ZOOM</div>
        </div>
      </section>

      <aside class="inspector" aria-label="Scene and properties">
        <div class="inspector-tabs">
          <button class="inspector-tab is-active" data-inspector="scene">SCENE <span id="sceneCount">0</span></button>
          <button class="inspector-tab" data-inspector="properties">PROPERTIES</button>
        </div>
        <div class="inspector-content" id="sceneInspector"></div>
        <div class="inspector-content is-hidden" id="propertiesInspector"></div>
      </aside>
    </div>

    <!-- Non-visual hooks keep the sketch actions available to keyboard commands. -->
    <div class="system-hooks" hidden aria-hidden="true">
      <button id="undoButton"></button><button id="redoButton"></button><button id="newButton"></button><button id="planeButton"></button>
      <button id="gridButton"></button><button id="snapButton" class="is-active"></button><button id="fitButton"></button>
      <button id="exportButton"></button><button id="importButton"></button><input id="importFile" type="file" />
      <span id="viewEyebrow"></span><span id="viewTitle"></span><span id="statusMessage"></span><span id="footerMessage"></span>
      <span id="geometryCount"></span><span id="planeCount"></span><span id="snapStep"></span>
    </div>
  </main>
  <script src="./app.js?v=4"></script>
</body>
</html>
