<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frontier · Sky Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0e; --panel:#111113; --card:#1a1a1d; --card-2:#222226; --card-3:#2a2a2f;
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.11);
    --text:#ececee; --muted:#8e8e95; --dim:#5c5c64;
    --green:#34c759; --yellow:#d9d63c; --red:#ff453a; --orange:#f2a34a; --blue:#6ec1ff; --violet:#b48cff; --cyan:#4fd1c5;
    --accent:#ffffff;
    --r-xl:26px; --r-l:20px; --r-m:14px; --r-pill:999px;
    font-family:Outfit,Lexend,system-ui,sans-serif;
  }
  *{box-sizing:border-box;user-select:none}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-weight:300}
  body{display:grid;grid-template-rows:56px 1fr;grid-template-columns:280px 1fr 350px;grid-template-areas:"top top top" "left view right";}

  /* ---------- Top bar ---------- */
  #topbar{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.2px;font-size:14px}
  .logo .dot{width:26px;height:26px;border-radius:9px;background:repeating-linear-gradient(135deg,#fff 0 3px,transparent 3px 7px);opacity:.9}
  .sep{width:1px;height:22px;background:var(--line-2)}
  .tod{display:flex;align-items:center;gap:10px;flex:1;max-width:560px;background:var(--card);border-radius:var(--r-pill);padding:6px 16px 6px 6px;height:40px}
  .tod .clock{font-size:14px;color:var(--text);min-width:52px;font-weight:400;font-variant-numeric:tabular-nums}
  .tod input[type=range]{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);border:0;background:var(--card-2);color:var(--text);font-size:12px;font-weight:400;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{background:var(--card-3)}
  .btn.active{background:#fff;color:#111}
  .btn.icon{width:30px;padding:0;justify-content:center}
  .chips{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:var(--r-pill)}
  .chip{height:32px;padding:0 14px;border-radius:var(--r-pill);font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;transition:.15s}
  .chip:hover{color:var(--text);background:var(--card-2)}
  .stats{margin-left:auto;font-size:11px;color:var(--dim);display:flex;gap:16px;letter-spacing:.3px}
  .stats b{color:var(--text);font-weight:400}

  /* ---------- Panels ---------- */
  .panel{background:var(--bg);display:flex;flex-direction:column;min-height:0;padding:0 8px 8px}
  #outliner{grid-area:left;padding-left:12px}
  #inspector{grid-area:right;padding-right:12px}
  .panel-head{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;font-size:11px;font-weight:400;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .panel-head .count{margin-left:auto;font-size:10px;padding:3px 9px;border-radius:99px;background:var(--card);color:var(--muted)}
  .panel-body{flex:1;overflow:auto;padding:6px}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:var(--card-3);border-radius:8px}
  .search{position:relative;margin:0 6px 6px}
  .search input{width:100%;height:38px;border-radius:var(--r-pill);border:0;background:var(--card);color:var(--text);padding:0 14px 0 36px;font-size:12px;outline:none;font-family:inherit;font-weight:300}
  .search input:focus{box-shadow:0 0 0 1px var(--line-2)}
  .search svg{position:absolute;left:13px;top:11px;width:15px;height:15px;stroke:var(--dim)}

  /* ---------- Outliner ---------- */
  .tree{display:flex;flex-direction:column;gap:3px;background:var(--panel);border-radius:var(--r-l);padding:6px}
  .node{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 var(--indent,8px);border-radius:var(--r-m);cursor:pointer;font-size:13px;color:#cfcfd4;transition:background .12s}
  .node:hover{background:var(--card)}
  .node.selected{background:#fff;color:#111}
  .node.selected .type,.node.selected .caret{color:#777}
  .node.selected .ico{background:#eee;color:#111}
  .node .caret{width:14px;height:14px;display:grid;place-items:center;color:var(--dim);transition:transform .15s;flex:none;font-size:10px}
  .node .caret.open{transform:rotate(90deg)}
  .node .caret.empty{visibility:hidden}
  .node .ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card-2);color:var(--text)}
  .node .ico svg{width:14px;height:14px}
  .node .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
  .node .type{font-size:10.5px;color:var(--dim);letter-spacing:.3px}
  .node .eye{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--dim);opacity:0;transition:.12s;font-size:11px}
  .node:hover .eye,.node .eye.off{opacity:1}
  .node .eye:hover{background:var(--card-3);color:var(--text)}
  .node .eye.off{color:var(--red)}
  .children{display:flex;flex-direction:column;gap:3px}
  .folder{height:44px}
  .folder .ico{background:var(--card-3);color:#fff}
  .tree-foot{margin-top:10px;padding:10px 8px;font-size:11px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .kbd{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--card);color:var(--muted)}

  /* ---------- Inspector ---------- */
  #inspContent{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;gap:8px;padding:0 4px 8px}
  #inspContent::-webkit-scrollbar{width:6px} #inspContent::-webkit-scrollbar-thumb{background:var(--card-3);border-radius:8px}
  .hero{background:var(--panel);border-radius:var(--r-xl);padding:18px 18px 16px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);pointer-events:none}
  .hero-top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .hero-top .rb{width:40px;height:40px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;color:var(--text)}
  .hero-top .rb svg{width:18px;height:18px}
  .hero-top .rb.ghost{margin-left:auto;font-size:18px;color:var(--muted);letter-spacing:1px;cursor:pointer}
  .hero-top .rb.ghost:hover{background:var(--card-3);color:#fff}
  .hero input.name{background:transparent;border:0;color:var(--text);font-size:30px;font-weight:300;letter-spacing:-.5px;outline:none;width:100%;font-family:inherit;padding:0;line-height:1.1}
  .hero .sub{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:300}
  .stat-pills{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
  .spill{height:40px;padding:0 16px;border-radius:var(--r-pill);background:var(--card);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
  .spill b{font-weight:400;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
  .spill.on{background:#fff;color:#555} .spill.on b{color:#111}
  .spill .led{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .spill .led.off{background:var(--red)}

  .card{background:var(--card);border-radius:var(--r-xl);padding:16px 16px 12px;transition:opacity .2s}
  .card.disabled .cbody,.card.disabled .hero-val,.card.disabled .spark{opacity:.35;pointer-events:none}
  .card-head{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:26px}
  .card-head .tick{width:3px;height:16px;border-radius:2px;background:var(--green);flex:none}
  .card-head .ctitle{font-size:15px;font-weight:400;flex:1;letter-spacing:.1px}
  .card-head .caret{width:26px;height:26px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;color:var(--muted);font-size:10px;transition:transform .15s}
  .card-head .caret.open{transform:rotate(90deg)}
  .hero-val{display:flex;align-items:baseline;gap:6px;margin:14px 0 2px;line-height:1}
  .hero-val .big{font-size:46px;font-weight:200;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
  .hero-val .big i{font-style:normal;color:var(--dim)}
  .hero-val .unit{font-size:15px;color:var(--muted);font-weight:300}
  .hero-val .trend{margin-left:auto;color:var(--muted);font-size:16px;align-self:flex-start}
  .hero-val .lbl{width:100%;font-size:11.5px;color:var(--dim);margin-top:6px;letter-spacing:.3px}
  .spark{height:56px;margin:8px 0 6px;position:relative;border-radius:8px;overflow:hidden}
  .spark canvas{width:100%;height:100%;display:block}
  .cbody{display:flex;flex-direction:column;gap:1px;padding-top:6px}
  .cbody.hidden{display:none}
  .group-lbl{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:14px 2px 6px;font-weight:400}
  .row{display:grid;grid-template-columns:118px 1fr;align-items:center;min-height:34px;gap:10px;padding:2px 4px;border-radius:10px}
  .row:hover{background:rgba(255,255,255,.03)}
  .row label{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;font-weight:300}
  .row:hover label{color:var(--text)}
  .ctl{display:flex;align-items:center;gap:8px;min-width:0}

  /* Range */
  input[type=range]{-webkit-appearance:none;appearance:none;height:20px;background:transparent;width:100%;margin:0;cursor:ew-resize}
  input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,50%),var(--card-3) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .1s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.2)}
  input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:var(--card-3)}
  input[type=range]::-moz-range-progress{height:2px;background:#fff}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
  .num{width:60px;height:28px;border-radius:var(--r-pill);border:0;background:var(--card-2);color:var(--text);font-family:inherit;font-size:12px;font-weight:400;text-align:center;padding:0 8px;outline:none;flex:none;font-variant-numeric:tabular-nums}
  .num:focus{box-shadow:0 0 0 1px var(--line-2);background:var(--card-3)}
  .unit{font-size:10.5px;color:var(--dim);width:14px;flex:none}

  /* Color */
  .color{display:flex;align-items:center;gap:10px;width:100%;height:32px;border-radius:var(--r-pill);background:var(--card-2);padding:4px 12px 4px 4px;position:relative;cursor:pointer}
  .color .sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
  .color .hex{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .color input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}

  /* Toggle */
  .toggle{position:relative;width:40px;height:22px;border-radius:99px;background:var(--card-3);cursor:pointer;flex:none;transition:.18s}
  .toggle::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#8e8e95;transition:.18s}
  .toggle.on{background:#fff}
  .toggle.on::after{left:21px;background:#111}

  /* Select / segmented */
  .select{position:relative;width:100%}
  .select select{width:100%;height:32px;appearance:none;-webkit-appearance:none;border-radius:var(--r-pill);border:0;background:var(--card-2);color:var(--text);font-size:12.5px;padding:0 30px 0 14px;outline:none;cursor:pointer;font-family:inherit;font-weight:400}
  .select::after{content:"";position:absolute;right:14px;top:11px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none}
  .seg{display:flex;flex-wrap:wrap;gap:4px;width:100%;padding:4px;border-radius:18px;background:var(--card-2)}
  .seg button{flex:1 0 28%;height:30px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;font-weight:400;transition:.15s}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:#fff;color:#111}
  .add-comp{width:100%;height:48px;border-radius:var(--r-xl);border:1px dashed var(--line-2);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;font-weight:300}
  .add-comp:hover{border-color:#fff;color:#fff}
  .empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:12px}

  /* ---------- Viewport ---------- */
  #view{grid-area:view;position:relative;min-width:0;min-height:0;background:#000;border-radius:var(--r-xl);overflow:hidden;margin:0 0 8px}
  #view canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;left:14px;top:14px;display:flex;gap:6px}
  .hud .pill{padding:9px 14px;border-radius:99px;background:rgba(14,14,16,.6);backdrop-filter:blur(12px);font-size:11.5px;color:var(--muted)}
  .hud .pill b{color:var(--text);font-weight:400}
  .gizmo{position:absolute;right:14px;bottom:14px;padding:10px 14px;border-radius:16px;background:rgba(14,14,16,.6);backdrop-filter:blur(12px);font-size:11px;color:var(--dim);line-height:1.7}
  .gizmo b{color:var(--muted);font-weight:400}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-size:12px;letter-spacing:1px;z-index:5;transition:opacity .4s}
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div id="topbar">
  <div class="logo"><span class="dot"></span>FRONTIER <span style="color:var(--dim);font-weight:500">/ Sky Editor</span></div>
  <div class="sep"></div>
  <div class="tod">
    <button class="btn icon active" id="playBtn" title="Play day cycle" style="width:30px;height:30px">▶</button>
    <span class="clock" id="clock">06:00</span>
    <input type="range" id="todRange" min="0" max="24" step="0.01" value="6.2">
  </div>
  <div class="chips">
    <span class="chip" data-t="5.9">🌅 Sunrise</span>
    <span class="chip" data-t="12">☀️ Noon</span>
    <span class="chip" data-t="18.3">🌇 Sunset</span>
    <span class="chip" data-t="0">🌙 Night</span>
  </div>
  <div class="stats"><span>FPS <b id="fps">--</b></span><span>SUN <b id="sunEl">--</b></span></div>
</div>

<!-- ============ OUTLINER ============ -->
<aside class="panel" id="outliner">
  <div class="panel-head">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
    Outliner <span class="count" id="entCount">0</span>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" placeholder="Search scene…">
  </div>
  <div class="panel-body"><div class="tree" id="tree"></div>
    <div class="tree-foot"><span class="kbd">↑↓</span> navigate <span class="kbd">H</span> hide <span class="kbd">F</span> focus</div>
  </div>
</aside>

<!-- ============ VIEWPORT ============ -->
<main id="view">
  <div id="loading">INITIALISING RENDERER…</div>
  <script>setTimeout(()=>{const l=document.getElementById('loading'); if(l) l.innerHTML='<div style="text-align:center;line-height:1.8">Still loading three.js from the CDN…<br><span style="color:#5b6375">If this persists, check your network connection (unpkg.com must be reachable).</span></div>';},12000);<\/script>
  <div class="hud">
    <span class="pill">CAM <b id="hudCam">Perspective</b></span>
    <span class="pill">EV <b id="hudEv">1.00</b></span>
    <span class="pill" id="hudPhase">MOON <b>—</b></span>
  </div>
  <div class="gizmo"><b>LMB</b> orbit · <b>RMB</b> pan · <b>Wheel</b> zoom<br>Look toward the sun at sunrise for the horizon line & flare</div>
</main>

<!-- ============ INSPECTOR ============ -->
<aside class="panel" id="inspector">
  <div class="panel-head">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>
    Inspector
  </div>
  <div id="inspContent" style="flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0"></div>
</aside>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   STATE — every entity's editable properties live here
===================================================================== */
const S = {
  time: 6.2, playing:false, daySpeed: 0.35,
  atmosphere:{ enabled:true, fogEnabled:true, fogDensity:0.0016, fogTint:'#c9d6e8', horizonEnabled:true, horizonStrength:1.4, horizonSharpness:180, horizonColor:'#fff4dc', horizonWidth:0.32, nightColor:'#0b1430', nightIntensity:0.6, ambient:0.35, groundColor:'#3b4a3a' },
  sun:{ enabled:true, elevation:3, azimuth:105, intensity:3.2, color:'#fff2d8', diskSize:1.0, diskIntensity:1.0, shadows:true, autoFromTime:true },
  sky:{ enabled:true, turbidity:4, rayleigh:2.2, mie:0.006, mieG:0.85, tint:'#ffffff', intensity:1.0 },
  stars:{ enabled:true, count:6000, brightness:1.2, size:1.6, twinkle:1.0, twinkleSpeed:1.0, warmth:0.4, milkyWay:0.5 },
  moon:{ enabled:true, elevation:35, azimuth:290, size:1.0, brightness:1.0, glow:0.8, tint:'#dfe6f2', autoPhase:true, phase:0.5, earthshine:0.12, light:0.25 },
  camera:{ fov:55, near:0.1, far:5000, autoOrbit:false, orbitSpeed:0.15 },
  post:{ enabled:true, exposure:1.0, toneMapping:'ACES', bloomEnabled:true, bloomStrength:0.55, bloomThreshold:0.85, bloomRadius:0.4, flareEnabled:true, flareType:'Cinematic', flareIntensity:1.0, flareGhosts:1.0, flareHalo:1.0, vignette:0.35, chroma:0.15, grain:0.04 },
};

/* =====================================================================
   RENDERER / SCENE
===================================================================== */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 5000);
camera.position.set(0, 3.5, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.53; controls.minDistance = 2; controls.maxDistance = 60;

/* ---------- Sky (Preetham + extras) ---------- */
const skyUniforms = {
  turbidity:{value:4}, rayleigh:{value:2.2}, mieCoefficient:{value:0.006}, mieDirectionalG:{value:0.85},
  sunPosition:{value:new THREE.Vector3()}, up:{value:new THREE.Vector3(0,1,0)},
  skyTint:{value:new THREE.Color(1,1,1)}, skyIntensity:{value:1},
  sunDiskCos:{value:0.99995}, sunDiskIntensity:{value:1},
  horizonStrength:{value:1.4}, horizonSharpness:{value:180}, horizonColor:{value:new THREE.Color('#fff4dc')}, horizonWidth:{value:0.32},
  nightColor:{value:new THREE.Color('#0b1430')}, nightIntensity:{value:0.6},
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite:false,
  vertexShader: /* glsl */`
    uniform vec3 sunPosition; uniform float rayleigh; uniform float turbidity; uniform float mieCoefficient; uniform vec3 up;
    varying vec3 vWorldPosition; varying vec3 vSunDirection; varying float vSunfade; varying vec3 vBetaR; varying vec3 vBetaM; varying float vSunE;
    const float e = 2.71828182845904523536;
    const vec3 totalRayleigh = vec3(5.804542996261093E-6, 1.3562911419845635E-5, 3.0265902468824876E-5);

function drawSparks(){

  } else if (p.t==='color'){
    const w = document.createElement('div'); w.className='color'; w.innerHTML = `<span class="sw" style="background:${st[p.key]}"></span><span class="hex">${st[p.key]}</span><input type="color" value="${st[p.key]}">`;
    w.querySelector('input').oninput = e=>{ st[p.key]=e.target.value; w.querySelector('.sw').style.background=e.target.value; w.querySelector('.hex').textContent=e.target.value; onChange(p.key); };
    ctl.append(w);
  } else if (p.t==='bool'){
    const t = document.createElement('span'); t.className='toggle'+(st[p.key]?' on':''); t.onclick = ()=>{ st[p.key]=!st[p.key]; t.classList.toggle('on', st[p.key]); onChange(p.key); }; ctl.append(t); row._sync = ()=>t.classList.toggle('on', !!st[p.key]);
  } else if (p.t==='select'){
    const w = document.createElement('div'); w.className='select'; w.innerHTML = `<select>${p.opts.map(o=>`<option ${o===st[p.key]?'selected':''}>${o}</option>`).join('')}</select>`;
    w.querySelector('select').onchange = e=>{ st[p.key]=e.target.value; onChange(p.key); }; ctl.append(w);
  } else if (p.t==='seg'){
    const w = document.createElement('div'); w.className='seg';
    for (const o of p.opts){ const b=document.createElement('button'); b.textContent=o; b.className = o===st[p.key]?'on':''; b.onclick=()=>{ st[p.key]=o; [...w.children].forEach(x=>x.classList.toggle('on', x.textContent===o)); onChange(p.key); }; w.append(b); }
    ctl.append(w);
  }
  return row;
}
const fmt = (v,step)=>{ const d = Math.max(0, Math.min(4, -Math.floor(Math.log10(step)))); return Number(v).toFixed(d); };

/* =====================================================================
   TOP BAR — time of day
===================================================================== */
const todRange = document.getElementById('todRange');
todRange.addEventListener('input', ()=>{ S.time = parseFloat(todRange.value); S.sun.autoFromTime = true; applyAll(); syncInspector(); });
document.querySelectorAll('.chip').forEach(c=>c.onclick = ()=>{ S.time = parseFloat(c.dataset.t); S.sun.autoFromTime=true; applyAll(); syncInspector(); });
const playBtn = document.getElementById('playBtn'); playBtn.onclick = ()=>{ S.playing=!S.playing; playBtn.classList.toggle('active',true); playBtn.textContent = S.playing?'❚❚':'▶'; };
function syncInspector(){ inspEl.querySelectorAll('.row').forEach(r=>r._sync && r._sync()); const h = inspEl.querySelector('.hero'); if (h && h._sync) h._sync(); }

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT' && e.target.type!=='range') return;
  const order = ['atmosphere','sun','sky','stars','moon','camera']; const i = order.indexOf(selected);
  if (e.key==='ArrowDown'){ selected = order[(i+1)%order.length]; renderTree(); renderInspector(); }
  if (e.key==='ArrowUp'){ selected = order[(i-1+order.length)%order.length]; renderTree(); renderInspector(); }
  if (e.key.toLowerCase()==='h') toggleVis(selected);
  if (e.key.toLowerCase()==='f'){ const d = selected==='moon'?moonDir:sunDir; if (selected==='sun'||selected==='moon'){ controls.target.copy(camera.position).add(d.clone().multiplyScalar(10)); } }
  if (e.key===' '){ playBtn.click(); e.preventDefault(); }
});

/* =====================================================================
   LOOP
===================================================================== */
function resize(){ const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w,h,false); composer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); bloom.resolution.set(w,h); }
new ResizeObserver(resize).observe(view); resize();

const clock = new THREE.Clock(); let fpsT=0, fpsN=0, sparkT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, clock.getDelta()); const t = clock.elapsedTime;
  if (S.playing){ S.time = (S.time + dt*S.daySpeed) % 24; S.sun.autoFromTime = true; if (selected==='sun') syncInspector(); }
  controls.update();
  applyAll();
  starMat.uniforms.uTime.value = t; gradePass.uniforms.time.value = t; sky.position.copy(camera.position);
  composer.render();
  drawFlare();
  if (t-sparkT>0.15){ sparkT=t; drawSparks(); }
  fpsN++; if (t-fpsT>0.5){ document.getElementById('fps').textContent = Math.round(fpsN/(t-fpsT)); fpsT=t; fpsN=0; }
}
renderTree(); renderInspector(); applyAll(); loop();
document.getElementById('loading').style.opacity=0; setTimeout(()=>document.getElementById('loading').remove(), 500);

/* =====================================================================
   PROCEDURAL TEXTURES / UTILS
===================================================================== */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function cnv(s){ const c=document.createElement('canvas'); c.width=c.height=s; return [c, c.getContext('2d')]; }
function makeGlowTexture(){ const [c,x]=cnv(256); const g=x.createRadialGradient(128,128,0,128,128,128); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.15,'rgba(255,255,255,.55)'); g.addColorStop(0.45,'rgba(255,255,255,.12)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,256,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function makeRingTexture(){ const [c,x]=cnv(256); const g=x.createRadialGradient(128,128,90,128,128,128); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,'rgba(255,255,255,.6)'); g.addColorStop(0.75,'rgba(255,255,255,.25)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,256,256); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function makeHexTexture(){ const [c,x]=cnv(128); x.translate(64,64); x.beginPath(); for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; x.lineTo(Math.cos(a)*58, Math.sin(a)*58);} x.closePath(); const g=x.createRadialGradient(0,0,10,0,0,60); g.addColorStop(0,'rgba(255,255,255,.35)'); g.addColorStop(0.85,'rgba(255,255,255,.5)'); g.addColorStop(1,'rgba(255,255,255,.9)'); x.fillStyle=g; x.fill(); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function makeStreakTexture(){ const [c,x]=cnv(512); const g=x.createLinearGradient(0,0,512,0); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,250,512,12); x.filter='blur(6px)'; x.fillRect(0,246,512,20); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
function makeMoonTexture(){ const [c,x]=cnv(512); x.fillStyle='#cfcfd2'; x.fillRect(0,0,512,512); const rnd=mulberry32(7);
  for(let i=0;i<260;i++){ const r=2+rnd()*rnd()*40, px=rnd()*512, py=rnd()*512; const g=x.createRadialGradient(px,py,r*0.2,px,py,r); const d=90+rnd()*80; g.addColorStop(0,`rgb(${d},${d},${d+6})`); g.addColorStop(0.8,`rgb(${d+30},${d+30},${d+34})`); g.addColorStop(1,'rgba(230,230,235,0)'); x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); }
  for(let i=0;i<9;i++){ const r=40+rnd()*90, px=rnd()*512, py=rnd()*512; const g=x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,'rgba(120,122,130,.55)'); g.addColorStop(1,'rgba(120,122,130,0)'); x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); }
  const t=new THREE.CanvasTexture(c); return t; }
