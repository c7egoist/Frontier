<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier — World Editor</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9' fill='none' stroke='white' stroke-width='2'/></svg>">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark" id="brandMark"></div>
      <div>
        <div class="wordmark">Frontier</div>
        <div class="proj">Shoreline · world.frontier</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="seg" id="layoutSeg">
      <button data-mode="outliner">Outliner</button>
      <button data-mode="split" class="active">Split</button>
      <button data-mode="inspector">Inspector</button>
    </div>
    <div class="divider"></div>
    <div id="addHost"></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="btnPalette">Command <span class="kbd">⌘K</span></button>
    <div class="divider"></div>
    <button class="iconbtn ghost" id="btnFrame" title="Frame everything  (Shift+F)"></button>
    <button class="iconbtn ghost" id="btnClosePops" title="Close all popups"></button>
    <button class="iconbtn ghost" id="btnHelp" title="Shortcuts"></button>
  </header>

  <div class="workspace">
    <aside class="dock dock-left" id="outliner"></aside>

    <section class="stage" id="stage">

      <header class="vp-head">
        <div class="vp-menus" id="vpMenus"></div>
        <div class="spacer"></div>
        <div class="isochip" id="isoBanner" style="display:none"></div>
        <div class="tstrip" id="transport"></div>
      </header>

      <div class="vp-view" id="vpView">
        <canvas id="gl"></canvas>
        <div class="vign" id="vign"></div>
        <div class="grain" id="grain"></div>
        <div id="billboards"></div>

        <div class="gatemask" id="gateMask"><div class="bar t"></div><div class="bar b"></div>
          <div class="gatetag" id="gateTag"></div></div>

        <div class="axisorb" id="axisOrb" title="Click an axis to snap the view · drag to orbit · double click to frame all">
          <div class="orbhint" id="orbHint"></div>
        </div>
      </div>

      <div class="console" id="console">
        <div class="csug" id="cmdSug"></div>
        <div class="crow">
          <span class="cprompt" id="cmdIcon"></span>
          <div class="cfield">
            <div class="cghost" aria-hidden="true"><span class="typed" id="cmdTyped"></span><span class="rest" id="cmdRest"></span></div>
            <input id="cmdInput" placeholder="Say what you want — “rotate cube 40 degrees on Z”, “add sphere at x 3 y 2 z -1”" spellcheck="false" autocomplete="off">
          </div>
          <span class="cecho" id="cmdEcho"></span>
          <span class="kbd" id="cmdKbd">⌘K</span>
          <button class="iconbtn ghost" id="cmdRun" title="Run  (Enter)"></button>
        </div>
      </div>

      <footer class="vp-foot">
        <div class="stats" id="vpStats"></div>
        <div class="spacer"></div>
        <div class="tod" id="todBar">
          <span class="clock" id="todClock">06:00</span>
          <div id="todSlider" style="flex:1"></div>
          <button class="iconbtn ghost" id="todPlay" title="Run the day cycle"></button>
        </div>
      </footer>

    </section>

    <aside class="dock dock-right" id="inspector">
      <div class="panel-header">
        <div class="ph-icon" id="insIcon"></div>
        <div style="min-width:0">
          <div class="ph-title" id="insTitle">Inspector</div>
          <div class="ph-sub" id="insSub">Nothing selected</div>
        </div>
        <div class="spacer"></div>
        <button class="iconbtn ghost" id="insPopout" title="Open as floating popup"></button>
        <button class="iconbtn ghost" id="insFocus" title="Frame in viewport  (F)"></button>
      </div>
      <div class="props" id="insBody"></div>
      <div class="panel-footer"><span id="insFoot">—</span></div>
    </aside>
  </div>

  <footer class="statusbar">
    <span class="dot"></span><span id="stRender">renderer</span>
    <span id="stCam">camera</span>
    <span id="stSel">selection</span>
    <div class="spacer" style="flex:1"></div>
    <span id="stHint">Click a billboard to select · click it again for settings · drag rows to re-parent</span>
  </footer>
</div>

<div id="popups"></div>
<div id="ctxmenu"></div>
<div id="toasts"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
