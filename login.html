<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Login</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7ff;
      --line: rgba(190, 216, 255, .18);
      --blue: #a9cfff;
      --ice: #e4efff;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #000;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }

    #particleField { position: fixed; z-index: 0; inset: 0; display: block; width: 100%; height: 100%; background: #000; }
    .atmosphere { position: fixed; z-index: 1; inset: 0; pointer-events: none; background:radial-gradient(ellipse at 50% 48%,transparent 32%,rgba(0,0,0,.28) 100%); }
    .site-shell { position:relative; z-index:2; display:flex; width:min(1380px,calc(100% - 72px)); min-height:100vh; flex-direction:column; margin:0 auto; padding:27px 0 24px; }
    .topbar { display:flex; align-items:center; justify-content:flex-start; min-height:38px; opacity:1; transform:translateY(0); transition:opacity .5s ease,transform .6s ease; }
    .brand-symbol { display:grid; width:36px; height:36px; place-items:center; border:1px solid rgba(205,226,255,.26); border-radius:11px; background:linear-gradient(145deg,rgba(132,177,239,.16),rgba(75,110,176,.035)); box-shadow:inset 0 1px rgba(255,255,255,.08),0 0 24px rgba(111,159,228,.07); color:#e6f1ff; }
    .main-layout { display:flex; flex:1; align-items:center; justify-content:flex-end; padding:42px 0 60px; transition:opacity .7s ease,transform .8s cubic-bezier(.2,.72,.22,1),filter .65s ease; }
    .login-card { width:min(370px,100%); padding:22px; border:1px solid var(--line); border-radius:19px; background:rgba(3,6,13,.58); box-shadow:0 24px 90px rgba(0,0,0,.52),inset 0 1px rgba(255,255,255,.045); backdrop-filter:blur(15px) saturate(112%); -webkit-backdrop-filter:blur(15px) saturate(112%); }
    .field + .field { margin-top:12px; }
    .input-wrap { position:relative; }
    .input-icon { position:absolute; top:50%; left:14px; width:16px; height:16px; color:rgba(183,207,239,.58); transform:translateY(-50%); pointer-events:none; }
    .field input { width:100%; height:49px; padding:0 14px 0 42px; border:1px solid rgba(190,216,255,.15); border-radius:10px; outline:none; background:rgba(1,4,10,.66); color:#f2f6ff; font-size:12px; transition:border-color .2s ease,box-shadow .2s ease,background .2s ease; }
    .field input::placeholder { color:rgba(174,191,218,.53); }
    .field input:focus { border-color:rgba(167,207,255,.62); background:rgba(7,13,25,.82); box-shadow:0 0 0 3px rgba(110,163,230,.09); }
    .login-button { display:flex; width:100%; min-height:49px; align-items:center; justify-content:center; gap:10px; margin-top:14px; border:1px solid rgba(236,246,255,.78); border-radius:10px; background:linear-gradient(100deg,#eef5ff,#c8ddf8); box-shadow:0 6px 28px rgba(132,180,238,.16),inset 0 1px rgba(255,255,255,.86); color:#101a29; cursor:pointer; font-size:11px; font-weight:760; transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,opacity .4s ease; }
    .login-button:hover:not(:disabled) { filter:brightness(1.05); transform:translateY(-1px); box-shadow:0 9px 32px rgba(139,188,247,.23); }
    .login-button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
    .login-button:disabled { cursor:wait; }
    .loading-orbit { width:15px; height:15px; border:1.5px solid rgba(17,32,52,.24); border-top-color:#172c49; border-radius:50%; animation:spin .65s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* The single login action triggers a cinematic particle-to-orbit transition. */
    body.is-entering .main-layout { opacity:0; transform:translateY(-14px) scale(.98); filter:blur(10px); pointer-events:none; }
    body.is-entering .topbar { opacity:0; transform:translateY(-9px); pointer-events:none; }
    .arrival { position:fixed; z-index:4; inset:0; display:grid; place-items:center; overflow:hidden; visibility:hidden; opacity:0; background:radial-gradient(ellipse at 50% 50%,rgba(9,19,37,.11),rgba(0,0,0,.23) 68%); transition:opacity .85s ease,visibility .85s; }
    body.is-arrived .arrival { visibility:visible; opacity:1; }
    .arrival::before { position:absolute; width:min(72vw,760px); aspect-ratio:1; border-radius:50%; background:radial-gradient(circle,rgba(67,115,193,.13),rgba(37,69,126,.055) 36%,transparent 71%); filter:blur(17px); content:""; }
    .portal-mark { position:relative; display:grid; width:72px; height:72px; place-items:center; border:1px solid rgba(206,229,255,.4); border-radius:50%; box-shadow:0 0 30px rgba(130,180,241,.25),inset 0 0 21px rgba(118,160,223,.12); opacity:0; transform:scale(.55); }
    .portal-mark::before,.portal-mark::after { position:absolute; inset:-12px; border:1px solid rgba(177,211,251,.2); border-radius:50%; content:""; }
    .portal-mark::after { inset:-24px; border-color:rgba(203,223,249,.11); }
    .portal-mark svg { color:#e8f3ff; filter:drop-shadow(0 0 13px rgba(181,215,255,.42)); }
    body.is-arrived .portal-mark { animation:portalIn 1.05s cubic-bezier(.16,.72,.24,1) .08s forwards; }
    body.is-arrived .portal-mark::before { animation:orbit 11s linear infinite; }
    body.is-arrived .portal-mark::after { animation:orbit 17s linear infinite reverse; }
    @keyframes portalIn { to { opacity:1; transform:scale(1); } }
    @keyframes orbit { to { transform:rotate(360deg); } }

    @media (max-width:740px) {
      .site-shell { width:min(100% - 34px,520px); padding:19px 0 20px; }
      .main-layout { justify-content:center; padding:34px 0 55px; }
      .login-card { width:min(370px,100%); }
    }
    @media (max-width:430px) {
      .site-shell { width:calc(100% - 28px); }
      .login-card { padding:17px; border-radius:16px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <canvas id="particleField" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="site-shell">
    <header class="topbar">
      <div class="brand-symbol" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2.8 14.7 9.3 21.2 12l-6.5 2.7L12 21.2l-2.7-6.5L2.8 12l6.5-2.7L12 2.8Z" stroke="currentColor" stroke-width="1.15"/><circle cx="12" cy="12" r="2.1" fill="currentColor"/></svg>
      </div>
    </header>

    <main class="main-layout">
      <section class="login-card" aria-label="Login form">
        <form id="loginForm" autocomplete="on">
          <div class="field">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2" stroke="currentColor" stroke-width="1.35"/><path d="m3.5 5 6.5 5.1L16.5 5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <input id="email" name="email" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
            </div>
          </div>
          <div class="field">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3.2" y="8.2" width="13.6" height="9" rx="2" stroke="currentColor" stroke-width="1.35"/><path d="M6 8.2V5.8a4 4 0 0 1 8 0v2.4" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="10" cy="12.7" r="1" fill="currentColor"/></svg>
              <input id="password" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
            </div>
          </div>
          <button class="login-button" id="loginButton" type="submit">Login <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
      </section>
    </main>
  </div>

  <section class="arrival" id="arrival" aria-hidden="true" aria-label="Login transition">
    <div class="portal-mark" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 24 24" fill="none"><path d="M12 2.8 14.7 9.3 21.2 12l-6.5 2.7L12 21.2l-2.7-6.5L2.8 12l6.5-2.7L12 2.8Z" stroke="currentColor" stroke-width="1.1"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></div>
  </section>

  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('particleField');
      const ctx = canvas.getContext('2d', { alpha: false });
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const loginForm = document.getElementById('loginForm');
      const loginButton = document.getElementById('loginButton');
      const arrival = document.getElementById('arrival');
      let width = 0, height = 0, dpr = 1, time = 0, lastFrame = 0;
      let columns = 0, rows = 0, points = [], bokeh = [];
      let pointerX = 0, pointerY = 0, smoothX = 0, smoothY = 0;
      let transitionStart = 0, entering = false;

      function randomGenerator(seed) {
        let value = seed >>> 0;
        return () => { value = (value * 1664525 + 1013904223) >>> 0; return value / 4294967296; };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const random = randomGenerator(83021 + width * 7 + height * 13);
        columns = Math.max(76, Math.min(172, Math.round(width / 8.2)));
        rows = Math.max(30, Math.min(48, Math.round(height / 16)));
        points = [];
        for (let row = 0; row < rows; row++) {
          const depth = row / (rows - 1);
          for (let col = 0; col < columns; col++) {
            points.push({ col, row, depth, x: -1.12 + 2.24 * col / (columns - 1), seed: random(), size: .38 + random() * .7, tone: random() });
          }
        }
        bokeh = [];
        for (let i = 0; i < 44; i++) {
          const size = random();
          bokeh.push({ x: random() * width, y: random() * height * .82, radius: size > .76 ? 12 + random() * 32 : 5 + random() * 13, alpha: .035 + random() * .09, phase: random() * Math.PI * 2, speed: .06 + random() * .2, hue: random() > .75 ? 252 : (random() > .45 ? 218 : 230) });
        }
        draw(0, 0);
      }

      function waveHeight(x, depth, t, seed) {
        const drift = t * .25;
        const broad = .205 * Math.sin(x * 3.0 + depth * 4.2 - drift);
        const fine = .065 * Math.sin(x * 8.1 - depth * 6.6 + t * .31 + seed * 1.4);
        const ridgeCenter = .5 * Math.sin(depth * 3.8 + t * .15);
        const ridge = .235 * Math.exp(-Math.pow((x - ridgeCenter) * 1.85, 2)) * Math.sin(depth * 9.6 - t * .55 + x * 1.7);
        const fold = .09 * Math.cos(x * 2.15 - depth * 7.4 + t * .18);
        return broad + fine + ridge + fold;
      }

      function screenPoint(point, t, pull) {
        const depth = point.depth;
        const scale = .28 + depth * 1.0;
        const wave = waveHeight(point.x, depth, t, point.seed);
        let px = width * .5 + point.x * width * .39 * scale + smoothX * (7 + depth * 14);
        let py = height * .455 + depth * height * .365 - wave * height * .71 * scale + smoothY * (5 + depth * 9);
        const slowBreath = .96 + .04 * Math.sin(t * .19 + point.seed * 4 + depth * 2);
        const alpha = (.14 + .55 * Math.pow(depth, 1.08)) * slowBreath;
        const radius = point.size * (.5 + depth * .95);
        if (pull > 0) {
          const cx = width * .5, cy = height * .49;
          const dx = px - cx, dy = py - cy;
          const angle = Math.atan2(dy, dx) + pull * (.75 + depth * .75) + t * .08 * pull;
          const startRadius = Math.hypot(dx, dy);
          const orbitRadius = Math.min(width, height) * (.18 + .2 * depth);
          const r = startRadius * (1 - pull) + orbitRadius * pull;
          px = cx + Math.cos(angle) * r;
          py = cy + Math.sin(angle) * r * .66;
        }
        return { x: px, y: py, alpha, radius, depth, tone: point.tone };
      }

      function drawBokeh(t) {
        for (const item of bokeh) {
          const alpha = item.alpha * (.93 + .07 * Math.sin(item.phase + t * item.speed));
          const x = item.x + smoothX * 3, y = item.y + smoothY * 2, r = item.radius;
          const glow = ctx.createRadialGradient(x, y, 0, x, y, r);
          glow.addColorStop(0, `hsla(${item.hue}, 64%, 83%, ${alpha})`);
          glow.addColorStop(.43, `hsla(${item.hue}, 68%, 75%, ${alpha * .42})`);
          glow.addColorStop(1, `hsla(${item.hue}, 72%, 67%, 0)`);
          ctx.fillStyle = glow; ctx.fillRect(x - r, y - r, r * 2, r * 2);
        }
      }

      function draw(t, pull) {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, width, height);
        const haze = ctx.createRadialGradient(width * .49, height * .68, 0, width * .49, height * .68, Math.max(width, height) * .72);
        haze.addColorStop(0, 'rgba(60, 99, 170, .23)'); haze.addColorStop(.42, 'rgba(26, 50, 99, .12)'); haze.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = haze; ctx.fillRect(0, 0, width, height);
        drawBokeh(t);

        const projected = new Array(points.length);
        for (let i = 0; i < points.length; i++) projected[i] = screenPoint(points[i], t, pull);

        // A finer, more visible point-cloud mesh gives the field a digital, flowing depth.
        ctx.save(); ctx.lineWidth = .64;
        for (let row = 1; row < rows; row += 2) {
          ctx.beginPath();
          for (let col = 0; col < columns; col++) {
            const p = projected[row * columns + col];
            if (col === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = `rgba(130, 174, 240, ${.035 + row / rows * .095})`; ctx.stroke();
        }
        for (let col = 2; col < columns; col += 5) {
          ctx.beginPath();
          for (let row = 0; row < rows; row++) {
            const p = projected[row * columns + col];
            if (row === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = 'rgba(118, 157, 230, .045)'; ctx.stroke();
        }
        ctx.restore();

        // Dense blue-violet and cool-white points; deliberately no starbursts or cross flares.
        for (let i = 0; i < projected.length; i++) {
          const p = projected[i];
          const tint = p.tone > .9 ? '218, 230, 255' : (p.tone > .64 ? '139, 164, 255' : (p.tone > .32 ? '83, 137, 235' : '160, 190, 246'));
          ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(.34, p.radius), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${tint}, ${p.alpha})`; ctx.fill();
        }

        // Soft curved energy ribbons follow the moving point-cloud surface.
        for (let band = 0; band < 3; band++) {
          const depth = .52 + band * .12;
          ctx.beginPath();
          for (let step = 0; step <= 100; step++) {
            const xn = -1.12 + 2.24 * step / 100;
            const yy = height * .455 + depth * height * .365 - waveHeight(xn, depth, t, band * .7) * height * .71 * (.28 + depth);
            const xx = width * .5 + xn * width * .39 * (.28 + depth);
            if (step === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
          }
          const ribbon = ctx.createLinearGradient(0, height * .42, width, height * .82);
          ribbon.addColorStop(0, 'rgba(91, 128, 219, 0)'); ribbon.addColorStop(.35, 'rgba(110, 153, 240, .18)'); ribbon.addColorStop(.58, 'rgba(205, 223, 255, .22)'); ribbon.addColorStop(.82, 'rgba(91, 132, 228, .12)'); ribbon.addColorStop(1, 'rgba(93, 129, 216, 0)');
          ctx.strokeStyle = ribbon; ctx.lineWidth = band === 1 ? 1.2 : .8; ctx.stroke();
        }

        const vignette = ctx.createRadialGradient(width * .5, height * .45, Math.min(width, height) * .22, width * .5, height * .45, Math.max(width, height) * .76);
        vignette.addColorStop(0, 'rgba(0, 0, 0, 0)'); vignette.addColorStop(1, 'rgba(0, 0, 0, .42)');
        ctx.fillStyle = vignette; ctx.fillRect(0, 0, width, height);
      }

      function animate(timestamp) {
        if (!lastFrame) lastFrame = timestamp;
        const dt = Math.min(.04, Math.max(0, (timestamp - lastFrame) / 1000)); lastFrame = timestamp;
        smoothX += (pointerX - smoothX) * .035; smoothY += (pointerY - smoothY) * .035;
        if (!reducedMotion.matches) time += dt * (entering ? 1.35 : 1);
        const pull = entering && !reducedMotion.matches ? Math.max(0, Math.min(1, (performance.now() - transitionStart) / 1600)) : 0;
        draw(time, pull); requestAnimationFrame(animate);
      }

      loginForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (entering) return;
        entering = true;
        loginButton.disabled = true;
        loginButton.innerHTML = '<span class="loading-orbit" aria-hidden="true"></span>';
        transitionStart = performance.now();
        document.body.classList.add('is-entering');
        window.setTimeout(() => { arrival.setAttribute('aria-hidden', 'false'); document.body.classList.add('is-arrived'); }, 620);
      });

      window.addEventListener('pointermove', (event) => {
        pointerX = (event.clientX / Math.max(1, width) - .5) * 2;
        pointerY = (event.clientY / Math.max(1, height) - .5) * 2;
      }, { passive: true });
      window.addEventListener('resize', resize, { passive: true });
      resize(); requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
