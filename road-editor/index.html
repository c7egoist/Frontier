<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frontier · Road Editor</title>
  <meta name="description" content="Browser road designer for the Frontier engine: plan and 3D split view, junction geometry, interchanges, paving, drainage, bridges, guardrails, markings and OBJ/JSON exchange." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-title">Frontier</span>
          <span class="brand-sub">Road Editor</span>
        </div>
      </div>

      <div class="menu" data-menu>
        <button class="menu-btn" type="button">Construct <span class="caret">▾</span></button>
        <div class="menu-list">
          <button type="button" data-tool="node">Junction tool <kbd>N</kbd></button>
          <button type="button" data-tool="road">Road tool <kbd>R</kbd></button>
          <button type="button" data-tool="interchange">Interchange tool <kbd>I</kbd></button>
          <div class="sep"></div>
          <button type="button" data-act="commit-crossings">Convert at-grade crossings</button>
          <div class="sep"></div>
          <button type="button" data-act="sample-crossroads">Sample: crossroads village</button>
          <button type="button" data-act="sample-valley">Sample: valley crossing</button>
          <button type="button" data-act="new-empty">New empty project</button>
          <div class="sep"></div>
          <button type="button" data-act="reset-storage">Clear saved copy</button>
        </div>
      </div>

      <div class="menu" data-menu>
        <button class="menu-btn" type="button">Exchange <span class="caret">▾</span></button>
        <div class="menu-list wide">
          <div class="menu-head">Export</div>
          <button type="button" data-act="export-bundle">Bundle (.zip): OBJ, MTL, textures, project</button>
          <button type="button" data-act="export-obj">OBJ + MTL only</button>
          <button type="button" data-act="export-json">Project (.json)</button>
          <div class="sep"></div>
          <div class="menu-head">Import</div>
          <button type="button" data-act="import">Open .json, .zip or .obj…</button>
          <button type="button" data-act="reference-toggle">Show or hide imported OBJ reference</button>
          <button type="button" data-act="reference-clear">Remove imported OBJ reference</button>
        </div>
      </div>

      <div class="tool-group" role="toolbar" aria-label="Tools">
        <button class="tool" type="button" data-tool="select" title="Select and move (V)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l9 6-4 1 2.5 4-1.6.9L8 10 4.5 12z" fill="currentColor"/></svg>
          <span>Select</span>
        </button>
        <button class="tool" type="button" data-tool="node" title="Place junction (N)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Junction</span>
        </button>
        <button class="tool" type="button" data-tool="road" title="Route road (R)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13c3-1 2-8 5-8s2-3 7-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="2" cy="13" r="1.6" fill="currentColor"/><circle cx="14" cy="2" r="1.6" fill="currentColor"/></svg>
          <span>Road</span>
        </button>
        <button class="tool" type="button" data-tool="interchange" title="Build interchange (I)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8h14" stroke="currentColor" stroke-width="2"/><path d="M8 1v6c0 2 3 2 3 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 1.5"/></svg>
          <span>Interchange</span>
        </button>
      </div>

      <div class="spacer"></div>

      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="split" title="Plan and 3D side by side">Split</button>
        <button type="button" data-view="plan" title="Plan only">Plan</button>
        <button type="button" data-view="3d" title="3D only">3D</button>
      </div>

      <div class="icon-group">
        <button id="btn-snap" class="icon-btn" type="button" title="Snap to half metres">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h12v12H2zM2 6h12M2 10h12M6 2v12M10 2v12" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button id="btn-markings" class="icon-btn" type="button" title="Show lane markings in plan">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1v3M8 6.5v3M8 12v3" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="btn-fit" class="icon-btn" type="button" title="Frame all (F)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button id="btn-undo" class="icon-btn" type="button" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4L2 7l3 3M2.5 7H10a4 4 0 010 8H7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" type="button" title="Redo (Ctrl+Shift+Z)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 4l3 3-3 3M13.5 7H6a4 4 0 000 8h3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel outliner">
        <div class="panel-head">
          <span class="panel-title">Outliner</span>
        </div>
        <button id="project-name" class="project-chip" type="button" title="Double-click to rename">Project</button>
        <div id="outliner-body" class="panel-body"></div>
      </aside>

      <main id="viewports" class="viewports" data-mode="split">
        <section class="pane plan">
          <div class="pane-head"><span>Plan</span><span class="muted">XZ · north up</span></div>
          <div class="pane-canvas"><canvas id="plan-canvas"></canvas></div>
        </section>
        <section class="pane view3d">
          <div class="pane-head"><span>Perspective</span><span class="muted">3D · Y up · metres</span></div>
          <div id="view3d" class="pane-canvas"></div>
        </section>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>

      <aside class="panel inspector">
        <div class="panel-head">
          <span class="panel-title">Inspector</span>
          <span id="insp-title" class="insp-current">Project</span>
        </div>
        <div id="inspector-body" class="panel-body"></div>
      </aside>
    </div>

    <footer class="statusbar">
      <span class="status-left"><span id="status-dot" class="status-dot ok"></span><span id="status-text">Starting…</span></span>
      <span id="tool-hint" class="tool-hint"></span>
      <span class="status-right">
        <span id="status-cursor" class="mono">x 0.0 z 0.0 m</span>
        <span id="status-build" class="mono dim"></span>
        <span id="status-warn" class="dim">clean</span>
        <span class="dim">FRONTIER ENGINE v0.1 · Y-UP · METERS</span>
      </span>
    </footer>

    <input id="import-file" type="file" accept=".json,.zip,.obj,application/json,application/zip" hidden />
  </div>
  <noscript>This editor needs JavaScript and WebGL.</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
